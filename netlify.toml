"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# Static Vite build with hash routing: every route is served by index.html at "/",
# so no SPA fallback redirect is needed.
[build]
  command = "npm run build"
  publish = "dist"
  environment = { NODE_VERSION = "24" }

# Hashed bundle files never change for a given name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Same-origin PostHog proxy (EU) so privacy blockers do not drop analytics.
# Order matters: the static assets rule must come first.
[[redirects]]
  from = "/ingest/static/*"
  to = "https://eu-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ingest/*"
  to = "https://eu.i.posthog.com/:splat"
  status = 200
  force = true
